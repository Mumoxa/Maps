name: SATURC temporary research ingest

on:
  push:
    branches:
      - ingest/saturc-2026-09-22
    paths:
      - tools/saturc_ingest/TRIGGER

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ingest/saturc-2026-09-22
      - name: Reconstruct and unpack verified research bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/saturc
          cat tools/saturc_ingest/chunk_*.txt | base64 -d > /tmp/saturc/bundle.tgz
          mkdir -p markets/accountants/research_runs/saturc_2026-09-22
          tar -xzf /tmp/saturc/bundle.tgz -C markets/accountants/research_runs/saturc_2026-09-22
          test "$(wc -l < markets/accountants/research_runs/saturc_2026-09-22/candidates.jsonl)" -eq 100
          rm -rf tools/saturc_ingest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ingest SATURC 2026-09-22 research run"
          git push origin HEAD:ingest/saturc-2026-09-22
